<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter Machine</title>
  <link rel="stylesheet" href="counter.css">
  <script src="counter.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="counter-container">
    <h1 class="counter-title">Counter Machine</h1>
    <div class="counter-box">
      <div class="count-display">
        <span id="count">0</span>
      </div>
      <div class="counter-buttons">
        <button id="decrement"><i class="fas fa-minus"></i></button>
        <button id="increment"><i class="fas fa-plus"></i></button>
        <button id="reset"><i class="fas fa-rotate-left"></i></button>
      </div>
    </div>
         <a href="/index.html" class="counter-btn">back my project</a>

  </div>
</body>
</html>
