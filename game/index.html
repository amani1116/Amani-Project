<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="game.css">
  <script src="game.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="game-container">
    <h1 class="game-title">Number Guessing Game</h1>
    <div class="game-box">
      <p class="instructions">Guess a number between <span id="min">1</span> and <span id="max">100</span></p>
      
      <input type="number" id="guess-input" placeholder="Enter your guess" min="1" max="100">
      <button class="guess-btn" id="check-btn">Check</button>
      <button class="guess-btn reset-btn" id="reset-btn">Reset</button>
      
      <div class="result-box">
        <p id="result-message">Make a guess!</p>
        <p>Attempts: <span id="attempts">0</span></p>
      </div>
    </div>
         <a href="/index.html" class="game-btn">back my project</a>

  </div>
</body>
</html>
