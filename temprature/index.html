<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter</title>
  <link rel="stylesheet" href="temprature.css">
  <script src="temprature.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="converter-container">
    <h1 class="converter-title">Temperature Converter</h1>
    <div class="converter-box">
      <div class="input-group">
        <input type="number" id="input-temp" placeholder="Enter value">
        <select id="input-unit">
          <option value="C">Celsius (°C)</option>
          <option value="F">Fahrenheit (°F)</option>
          <option value="K">Kelvin (K)</option>
        </select>
      </div>
      <div class="output-group">
        <p class="output">Celsius: <span id="celsius">0</span> °C</p>
        <p class="output">Fahrenheit: <span id="fahrenheit">32</span> °F</p>
        <p class="output">Kelvin: <span id="kelvin">273.15</span> K</p>
      </div>
      <button class="convert-btn" id="convert">Convert</button>
    </div>
         <a href="/index.html".html" class="temprature-btn">back my project</a>

  </div>
</body>
</html>
